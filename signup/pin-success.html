<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>R2O — All Set!</title>
<link rel="stylesheet" href="../shared.css" />
<style>
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--white);
  padding: 40px 32px 56px;
  text-align: center;
}

.check-wrap {
  width: 110px;
  height: 110px;
  position: relative;
  margin: 0 auto 32px;
}
.check-circle {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: var(--teal-light);
  animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
}
.check-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: fadeUp 0.3s 0.4s ease both;
  opacity: 0;
}

/* Floating avatar badge top-right of check */
.badge-float {
  position: absolute;
  top: -4px;
  right: -4px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00B894, #007A63);
  border: 3px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeUp 0.3s 0.5s ease both;
  opacity: 0;
}

@keyframes pop {
  from { transform: scale(0.3); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translate(-50%, -40%); }
  to   { opacity: 1; transform: translate(-50%, -50%); }
}
.badge-float-anim {
  animation: badgePop 0.4s 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  opacity: 0;
}
@keyframes badgePop {
  from { opacity: 0; transform: scale(0); }
  to   { opacity: 1; transform: scale(1); }
}

.title {
  font-family: 'Nunito', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 12px;
  line-height: 1.3;
}

.body {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.8;
  margin-bottom: 44px;
}
.body span { font-weight: 700; color: var(--text); }

.btn-wrap { width: 100%; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41 AM</span>
    <span style="display:flex;align-items:center;gap:4px">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#1A1A2E"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#1A1A2E"/><rect x="9" y="0" width="3" height="12" rx="1" fill="#1A1A2E"/><rect x="13.5" y="1" width="2.5" height="11" rx="1" fill="#9CA3AF"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.5C10.2 2.5 12.2 3.4 13.6 4.9L15 3.5C13.2 1.6 10.7 0.5 8 0.5C5.3 0.5 2.8 1.6 1 3.5L2.4 4.9C3.8 3.4 5.8 2.5 8 2.5Z" fill="#1A1A2E"/><path d="M8 5.5C9.5 5.5 10.8 6.1 11.8 7.1L13.2 5.7C11.8 4.4 10 3.5 8 3.5C6 3.5 4.2 4.4 2.8 5.7L4.2 7.1C5.2 6.1 6.5 5.5 8 5.5Z" fill="#1A1A2E"/><circle cx="8" cy="10" r="1.5" fill="#1A1A2E"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#1A1A2E" stroke-opacity="0.35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#1A1A2E"/><path d="M23 4.5V7.5C23.8 7.2 24.5 6.4 24.5 6C24.5 5.6 23.8 4.8 23 4.5Z" fill="#1A1A2E" fill-opacity="0.4"/></svg>
    </span>
  </div>

  <div class="screen">
    <div class="check-wrap">
      <div class="check-circle"></div>
      <div class="check-icon">
        <svg width="50" height="38" viewBox="0 0 50 38" fill="none">
          <path d="M3 19L17 33L47 3" stroke="#00B894" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="badge-float badge-float-anim">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 8L7 12L13 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <div class="title">PIN Set Up Successfully!</div>
    <div class="body">
      Your R2O account is ready.<br>
      You can now log in using your <span>NRC number</span> and <span>PIN</span> to manage your contracts and payments.
    </div>

    <div class="btn-wrap">
      <button class="btn btn-primary" onclick="location.href='../login/login.html'">
        Login to Your Account
      </button>
    </div>
  </div>
</div>
</body>
</html>
