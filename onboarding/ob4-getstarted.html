<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>R2O — Onboarding 4</title>
<link rel="stylesheet" href="../shared.css" />
<style>
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--white);
  overflow: hidden;
}

/* Full-bleed hero image covers top ~60% */
.hero {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 62%;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hero-placeholder {
  width: 100%;
  height: 100%;
  background: linear-gradient(160deg, #B2DFD8 0%, #007A63 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Gradient overlay at bottom of image */
.hero-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 50%;
  background: linear-gradient(to top, var(--white) 30%, transparent);
}

/* Content card sits over the bottom gradient */
.content {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 24px 28px 36px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.title {
  font-family: 'Nunito', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.3;
}

.body-text {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.7;
}

.dots {
  margin-bottom: 4px;
}

/* Features row — small pill badges */
.features {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 4px 0;
}
.feature-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--teal-light);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 700;
  color: var(--teal-dark);
}
.feature-pill svg { flex-shrink: 0; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar" style="position:relative;z-index:20">
    <span>9:41 AM</span>
    <span style="display:flex;align-items:center;gap:4px">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#1A1A2E"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#1A1A2E"/><rect x="9" y="0" width="3" height="12" rx="1" fill="#1A1A2E"/><rect x="13.5" y="1" width="2.5" height="11" rx="1" fill="#9CA3AF"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.5C10.2 2.5 12.2 3.4 13.6 4.9L15 3.5C13.2 1.6 10.7 0.5 8 0.5C5.3 0.5 2.8 1.6 1 3.5L2.4 4.9C3.8 3.4 5.8 2.5 8 2.5Z" fill="#1A1A2E"/><path d="M8 5.5C9.5 5.5 10.8 6.1 11.8 7.1L13.2 5.7C11.8 4.4 10 3.5 8 3.5C6 3.5 4.2 4.4 2.8 5.7L4.2 7.1C5.2 6.1 6.5 5.5 8 5.5Z" fill="#1A1A2E"/><circle cx="8" cy="10" r="1.5" fill="#1A1A2E"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#1A1A2E" stroke-opacity="0.35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#1A1A2E"/><path d="M23 4.5V7.5C23.8 7.2 24.5 6.4 24.5 6C24.5 5.6 23.8 4.8 23 4.5Z" fill="#1A1A2E" fill-opacity="0.4"/></svg>
    </span>
  </div>

  <div class="screen">
    <div class="hero">
      <!-- Replace src with your actual image path -->
      <img src="assets/ob4.jpg" alt="Get started with R2O" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
      <div class="hero-placeholder" style="display:none">
        <svg width="100" height="80" viewBox="0 0 100 80" fill="none">
          <rect x="10" y="10" width="80" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
          <rect x="20" y="20" width="30" height="40" rx="4" fill="rgba(255,255,255,0.4)"/>
          <circle cx="70" cy="40" r="15" fill="rgba(255,255,255,0.3)"/>
          <path d="M62 40L68 46L80 34" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="hero-overlay"></div>
    </div>

    <div class="content">
      <div class="title">Get Started Today</div>

      <div class="features">
        <div class="feature-pill">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="#00B894" stroke-width="1.5"/><path d="M4.5 7L6.5 9L9.5 5" stroke="#00B894" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Fast approval
        </div>
        <div class="feature-pill">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="#00B894" stroke-width="1.5"/><path d="M4.5 7L6.5 9L9.5 5" stroke="#00B894" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Easy monthly payments
        </div>
        <div class="feature-pill">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="#00B894" stroke-width="1.5"/><path d="M4.5 7L6.5 9L9.5 5" stroke="#00B894" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Loyalty rewards
        </div>
      </div>

      <div class="body-text">
        Manage your contracts, track payments, and unlock exclusive Loyalty Loans — all from one app. R2O clients get a dedicated digital experience built just for them.
      </div>

      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot active"></div>
      </div>

      <button class="btn btn-primary" onclick="location.href='../login/login.html'">Get Started</button>
    </div>
  </div>
</div>
<script src="../navigator.js"></script>
</body>
</html>
