<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>R2O — Onboarding 1</title>
<link rel="stylesheet" href="../shared.css" />
<style>
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--white);
  padding: 40px 32px 48px;
  position: relative;
}

.bottom {
  position: absolute;
  bottom: 36px;
  left: 28px;
  right: 28px;
}

/* Logo */
.logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  animation: fadeUp 0.6s ease both;
}

.logo-rent {
  font-family: 'Nunito', sans-serif;
  font-size: 52px;
  font-weight: 900;
  color: var(--teal);
  line-height: 1;
  letter-spacing: -1px;
}

.logo-own-row {
  display: flex;
  align-items: center;
  gap: 0;
}

.logo-wave {
  width: 48px;
  height: 32px;
  flex-shrink: 0;
}

.logo-own {
  font-family: 'Nunito', sans-serif;
  font-size: 52px;
  font-weight: 900;
  color: var(--text);
  line-height: 1;
  letter-spacing: -1px;
}

.tagline {
  font-size: 14px;
  color: var(--text2);
  margin-top: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  animation: fadeUp 0.6s 0.2s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41 AM</span>
    <span style="display:flex;align-items:center;gap:4px">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#1A1A2E"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#1A1A2E"/><rect x="9" y="0" width="3" height="12" rx="1" fill="#1A1A2E"/><rect x="13.5" y="1" width="2.5" height="11" rx="1" fill="#9CA3AF"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.5C10.2 2.5 12.2 3.4 13.6 4.9L15 3.5C13.2 1.6 10.7 0.5 8 0.5C5.3 0.5 2.8 1.6 1 3.5L2.4 4.9C3.8 3.4 5.8 2.5 8 2.5Z" fill="#1A1A2E"/><path d="M8 5.5C9.5 5.5 10.8 6.1 11.8 7.1L13.2 5.7C11.8 4.4 10 3.5 8 3.5C6 3.5 4.2 4.4 2.8 5.7L4.2 7.1C5.2 6.1 6.5 5.5 8 5.5Z" fill="#1A1A2E"/><circle cx="8" cy="10" r="1.5" fill="#1A1A2E"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#1A1A2E" stroke-opacity="0.35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#1A1A2E"/><path d="M23 4.5V7.5C23.8 7.2 24.5 6.4 24.5 6C24.5 5.6 23.8 4.8 23 4.5Z" fill="#1A1A2E" fill-opacity="0.4"/></svg>
    </span>
  </div>

  <div class="screen">
    <div class="logo-wrap">
      <!-- Logo image — place your logo file at assets/logo.png -->
      <img src="../onboarding/assets/logo.png"
           alt="Rent2Own"
           style="max-width:200px;max-height:100px;object-fit:contain;"
           onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex';" />

      <!-- Fallback text logo shown if image not found -->
      <div id="logo-fallback" style="display:none;flex-direction:column;align-items:flex-start">
        <div class="logo-rent">Rent</div>
        <div class="logo-own-row">
          <svg class="logo-wave" viewBox="0 0 48 32" fill="none">
            <path d="M4 16 Q12 4 20 16 Q28 28 36 16 Q42 8 48 14" stroke="#00B894" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path d="M4 20 Q12 8 20 20 Q28 32 36 20 Q42 12 48 18" stroke="#007A63" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
          </svg>
          <div class="logo-own">Own</div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <button class="btn btn-primary" onclick="location.href='ob2-whatis.html'">Get Started</button>
    </div>
  </div>

  <script>
    // Auto-redirect after 3 seconds if user doesn't tap
    // Comment this out if you want manual tap only
    // setTimeout(() => location.href = 'ob2-whatis.html', 3000);
  </script>
</div>
<script src="../navigator.js"></script>
</body>
</html>
