<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>R2O — Forgot PIN</title>
<link rel="stylesheet" href="../shared.css" />
<style>
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--white);
}
.topbar {
  padding: 12px 20px;
  display: flex;
  align-items: center;
}
.back-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.back-btn:hover { background: var(--bg); }
.content {
  flex: 1;
  padding: 8px 28px 32px;
  display: flex;
  flex-direction: column;
}
.heading {
  font-family: 'Nunito', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
}
.subheading {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  margin-bottom: 32px;
}
.lbl {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 8px;
  display: block;
}
.inp {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 14px;
  color: var(--text);
  font-family: 'Nunito Sans', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}
.inp:focus { border-color: var(--teal); }
.inp::placeholder { color: var(--text3); }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41 AM</span>
    <span style="display:flex;align-items:center;gap:4px">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#1A1A2E"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#1A1A2E"/><rect x="9" y="0" width="3" height="12" rx="1" fill="#1A1A2E"/><rect x="13.5" y="1" width="2.5" height="11" rx="1" fill="#9CA3AF"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.5C10.2 2.5 12.2 3.4 13.6 4.9L15 3.5C13.2 1.6 10.7 0.5 8 0.5C5.3 0.5 2.8 1.6 1 3.5L2.4 4.9C3.8 3.4 5.8 2.5 8 2.5Z" fill="#1A1A2E"/><path d="M8 5.5C9.5 5.5 10.8 6.1 11.8 7.1L13.2 5.7C11.8 4.4 10 3.5 8 3.5C6 3.5 4.2 4.4 2.8 5.7L4.2 7.1C5.2 6.1 6.5 5.5 8 5.5Z" fill="#1A1A2E"/><circle cx="8" cy="10" r="1.5" fill="#1A1A2E"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#1A1A2E" stroke-opacity="0.35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#1A1A2E"/><path d="M23 4.5V7.5C23.8 7.2 24.5 6.4 24.5 6C24.5 5.6 23.8 4.8 23 4.5Z" fill="#1A1A2E" fill-opacity="0.4"/></svg>
    </span>
  </div>

  <div class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="location.href='pin-login.html'">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M14 18L7 11L14 4" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="content">
      <div class="heading">Forgot your PIN?</div>
      <div class="subheading">
        Enter your registered phone number. We will send an OTP to reset your PIN.
      </div>

      <div style="margin-bottom:24px">
        <label class="lbl">Phone Number</label>
        <input class="inp" type="tel" placeholder="Enter phone number" />
      </div>

      <button class="btn btn-primary" onclick="location.href='forgot-otp.html'">
        Send OTP
      </button>
    </div>
  </div>
</div>
</body>
</html>
