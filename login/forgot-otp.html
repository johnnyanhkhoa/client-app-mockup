<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>R2O — OTP Verification</title>
<link rel="stylesheet" href="../shared.css" />
<style>
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--white);
}
.topbar {
  padding: 12px 20px;
  display: flex;
  align-items: center;
}
.back-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  transition: background 0.15s;
}
.back-btn:hover { background: var(--bg); }

.content {
  flex: 1;
  padding: 8px 28px 0;
  display: flex;
  flex-direction: column;
}
.heading {
  font-family: 'Nunito', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
}
.subheading {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  margin-bottom: 28px;
}
.phone-highlight {
  font-weight: 700;
  color: var(--text);
}

/* OTP boxes */
.otp-boxes {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.otp-box {
  flex: 1;
  height: 54px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  transition: border-color 0.2s, background 0.2s;
}
.otp-box.filled {
  border-color: var(--teal);
  background: var(--white);
}
.otp-box.active {
  border-color: var(--teal);
  background: var(--white);
}

.timer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.timer {
  font-size: 12px;
  color: var(--text3);
}
.resend {
  font-size: 13px;
  color: var(--teal);
  font-weight: 700;
  cursor: pointer;
  border: none;
  background: none;
  font-family: 'Nunito Sans', sans-serif;
}
.resend:disabled {
  color: var(--text3);
  cursor: default;
}

/* Keypad */
.keypad {
  flex-shrink: 0;
  background: var(--white);
  border-top: 1px solid var(--border);
}
.keypad-row {
  display: flex;
  border-bottom: 1px solid var(--border);
}
.keypad-row:last-child { border-bottom: none; }
.key {
  flex: 1;
  padding: 18px 0;
  text-align: center;
  font-family: 'Nunito', sans-serif;
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  border-right: 1px solid var(--border);
  transition: background 0.15s;
  user-select: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
}
.key:last-child { border-right: none; }
.key:active { background: var(--bg); }
.key-sub { font-size: 10px; color: var(--text3); font-weight: 400; }
.key-empty { background: var(--bg); cursor: default; }
.key-empty:active { background: var(--bg); }
.key-delete { background: var(--bg); }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41 AM</span>
    <span style="display:flex;align-items:center;gap:4px">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#1A1A2E"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#1A1A2E"/><rect x="9" y="0" width="3" height="12" rx="1" fill="#1A1A2E"/><rect x="13.5" y="1" width="2.5" height="11" rx="1" fill="#9CA3AF"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.5C10.2 2.5 12.2 3.4 13.6 4.9L15 3.5C13.2 1.6 10.7 0.5 8 0.5C5.3 0.5 2.8 1.6 1 3.5L2.4 4.9C3.8 3.4 5.8 2.5 8 2.5Z" fill="#1A1A2E"/><path d="M8 5.5C9.5 5.5 10.8 6.1 11.8 7.1L13.2 5.7C11.8 4.4 10 3.5 8 3.5C6 3.5 4.2 4.4 2.8 5.7L4.2 7.1C5.2 6.1 6.5 5.5 8 5.5Z" fill="#1A1A2E"/><circle cx="8" cy="10" r="1.5" fill="#1A1A2E"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#1A1A2E" stroke-opacity="0.35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#1A1A2E"/><path d="M23 4.5V7.5C23.8 7.2 24.5 6.4 24.5 6C24.5 5.6 23.8 4.8 23 4.5Z" fill="#1A1A2E" fill-opacity="0.4"/></svg>
    </span>
  </div>

  <div class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="location.href='forgot-pin.html'">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M14 18L7 11L14 4" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="content">
      <div class="heading">OTP Verification</div>
      <div class="subheading">
        We sent a 6-digit OTP to <span class="phone-highlight">09*******12</span>.<br>
        Please enter it below. Valid for 5 minutes.
      </div>

      <div class="otp-boxes" id="otpBoxes">
        <div class="otp-box filled" id="o0">1</div>
        <div class="otp-box active"  id="o1"> </div>
        <div class="otp-box"         id="o2"> </div>
        <div class="otp-box"         id="o3"> </div>
        <div class="otp-box"         id="o4"> </div>
        <div class="otp-box"         id="o5"> </div>
      </div>

      <div class="timer-row">
        <span class="timer" id="timer">Resend in 0:59</span>
        <button class="resend" id="resendBtn" disabled onclick="resendOtp()">Resend OTP</button>
      </div>

      <button class="btn btn-primary" onclick="verifyOtp()">Verify OTP</button>
    </div>

    <div class="keypad">
      <div class="keypad-row">
        <div class="key" onclick="tapKey('1')">1<span class="key-sub"> </span></div>
        <div class="key" onclick="tapKey('2')">2<span class="key-sub">ABC</span></div>
        <div class="key" onclick="tapKey('3')">3<span class="key-sub">DEF</span></div>
      </div>
      <div class="keypad-row">
        <div class="key" onclick="tapKey('4')">4<span class="key-sub">GHI</span></div>
        <div class="key" onclick="tapKey('5')">5<span class="key-sub">JKL</span></div>
        <div class="key" onclick="tapKey('6')">6<span class="key-sub">MNO</span></div>
      </div>
      <div class="keypad-row">
        <div class="key" onclick="tapKey('7')">7<span class="key-sub">PQRS</span></div>
        <div class="key" onclick="tapKey('8')">8<span class="key-sub">TUV</span></div>
        <div class="key" onclick="tapKey('9')">9<span class="key-sub">WXYZ</span></div>
      </div>
      <div class="keypad-row">
        <div class="key key-empty"></div>
        <div class="key" onclick="tapKey('0')">0</div>
        <div class="key key-delete" onclick="deleteKey()">
          <svg width="24" height="18" viewBox="0 0 24 18" fill="none">
            <path d="M9 1H22C22.552 1 23 1.448 23 2V16C23 16.552 22.552 17 22 17H9L1 9L9 1Z" stroke="#6B7280" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M19 6L13 12M13 6L19 12" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let otp = ['1','','','','',''];
let pos = 1;

function renderBoxes() {
  for (let i = 0; i < 6; i++) {
    const box = document.getElementById('o' + i);
    box.className = 'otp-box';
    if (otp[i]) { box.textContent = otp[i]; box.classList.add('filled'); }
    else if (i === pos) { box.textContent = ''; box.classList.add('active'); }
    else { box.textContent = ''; }
  }
}

function tapKey(d) {
  if (pos >= 6) return;
  otp[pos] = d; pos++;
  renderBoxes();
  if (pos === 6) setTimeout(verifyOtp, 300);
}

function deleteKey() {
  if (pos <= 0) return;
  pos--; otp[pos] = '';
  renderBoxes();
}

function verifyOtp() {
  location.href = 'new-pin.html';
}

function resendOtp() {
  document.getElementById('resendBtn').disabled = true;
  startTimer(59);
}

let timerInterval;
function startTimer(s) {
  clearInterval(timerInterval);
  let sec = s;
  const timerEl = document.getElementById('timer');
  const resendEl = document.getElementById('resendBtn');
  timerEl.style.display = 'inline';
  resendEl.disabled = true;
  timerInterval = setInterval(() => {
    timerEl.textContent = `Resend in 0:${sec.toString().padStart(2,'0')}`;
    sec--;
    if (sec < 0) {
      clearInterval(timerInterval);
      timerEl.style.display = 'none';
      resendEl.disabled = false;
    }
  }, 1000);
}

startTimer(59);
</script>
</body>
</html>
